<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Estrutura comum a todas as páginas: <head>, menu, alertas, rodapé e scripts. -->

<head th:fragment="cabecalho(titulo)">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${titulo} + ' · PetPath Saúde'">PetPath Saúde</title>
	<link rel="icon" type="image/svg+xml" th:href="@{/img/logo.svg}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

	<nav th:fragment="menu" th:if="${usuarioLogado != null}" class="navbar navbar-expand-lg app-navbar sticky-top">
		<div class="container">
			<a class="navbar-brand" th:href="@{/home}">
				<img th:src="@{/img/logo.svg}" alt="" width="34" height="34"> PetPath <span>Saúde</span>
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
				aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="menuPrincipal">
				<ul class="navbar-nav me-auto gap-lg-1 mt-3 mt-lg-0">
					<li class="nav-item">
						<a class="nav-link" th:href="@{/home}"
							th:classappend="${uriAtual == '/home'} ? 'active'"><i class="bi bi-house-door me-1"></i>Início</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/pets}"
							th:classappend="${uriAtual != null and #strings.startsWith(uriAtual, '/pets')} ? 'active'"><i class="bi bi-heart-pulse me-1"></i>Pets</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/consultas}"
							th:classappend="${uriAtual != null and #strings.startsWith(uriAtual, '/consultas')} ? 'active'"><i class="bi bi-calendar2-check me-1"></i>Consultas</a>
					</li>
					<li class="nav-item" th:if="${isAdminLogado}">
						<a class="nav-link" th:href="@{/tutores}"
							th:classappend="${uriAtual != null and #strings.startsWith(uriAtual, '/tutores')} ? 'active'"><i class="bi bi-people me-1"></i>Tutores</a>
					</li>
				</ul>
				<div class="d-flex align-items-center gap-2 py-3 py-lg-0">
					<span class="avatar" th:text="${iniciaisPerfilLogado}" aria-hidden="true">PP</span>
					<div class="lh-sm me-2">
						<div class="fw-semibold" th:text="${nomePerfilLogado}">Usuário</div>
						<small class="text-suave" th:text="${isAdminLogado} ? 'Equipe da clínica' : 'Tutor'">Perfil</small>
					</div>
					<form th:action="@{/logout}" method="post" class="ms-auto ms-lg-0">
						<button type="submit" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
					</form>
				</div>
			</div>
		</div>
	</nav>

	<div th:fragment="alertas">
		<div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
			<i class="bi bi-check-circle-fill me-2"></i><span th:text="${sucesso}">Mensagem</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
		</div>
		<div th:if="${erroNegocio}" class="alert alert-danger d-flex align-items-center" role="alert">
			<i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${erroNegocio}">Erro</span>
		</div>
	</div>

	<footer th:fragment="rodape" class="rodape py-3 mt-5">
		<div class="container d-flex flex-wrap justify-content-between gap-2">
			<span><b>PetPath Saúde</b> · cuidado preventivo para pets</span>
			<span>Challenge FIAP · parceiro CLYVO VET</span>
		</div>
	</footer>

	<th:block th:fragment="scripts">
		<div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-labelledby="tituloConfirmacao" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header border-0">
						<h2 class="modal-title h5" id="tituloConfirmacao">Tem certeza?</h2>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
					</div>
					<div class="modal-body pt-0" data-texto-confirmacao>Confirma esta ação?</div>
					<div class="modal-footer border-0">
						<button type="button" class="btn btn-light" data-bs-dismiss="modal">Voltar</button>
						<button type="button" class="btn btn-danger" data-botao-confirmacao>Confirmar</button>
					</div>
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
		<script th:src="@{/js/app.js}"></script>
	</th:block>

</body>
</html>
