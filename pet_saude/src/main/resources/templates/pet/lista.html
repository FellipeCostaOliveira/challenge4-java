<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Pets')}"></head>
<body>
	<nav th:replace="~{fragmentos/layout :: menu}"></nav>
	<main class="container py-4">
		<div th:replace="~{fragmentos/layout :: alertas}"></div>

		<div class="cabecalho-pagina">
			<div>
				<h1 th:text="${isAdminLogado} ? 'Pets atendidos' : 'Meus pets'">Pets</h1>
				<p th:text="${isAdminLogado} ? 'Todos os pets cadastrados pelos tutores.' : 'Abra a ficha do pet para ver o plano preventivo e agendar.'">Descrição</p>
			</div>
			<div class="d-flex flex-wrap gap-2">
				<form th:replace="~{fragmentos/formulario :: busca('/pets', ${busca}, 'Buscar por nome, raça ou tutor')}"></form>
				<a th:unless="${isAdminLogado}" th:href="@{/pets/novo}" class="btn btn-coral"><i class="bi bi-plus-lg me-1"></i>Cadastrar pet</a>
			</div>
		</div>

		<div class="card">
			<th:block th:unless="${pets.isEmpty()}">
				<div th:replace="~{fragmentos/componentes :: tabelaPets(${pets}, ${isAdminLogado})}"></div>
			</th:block>
			<th:block th:if="${pets.isEmpty()}" th:with="buscou=${busca != null and !busca.isBlank()}">
				<div th:replace="~{fragmentos/componentes :: estadoVazio('bi-search-heart', ${buscou ? 'Nenhum pet encontrado' : 'Nenhum pet cadastrado ainda'}, ${buscou ? 'Tente buscar por outro termo.' : 'Os pets cadastrados aparecerão aqui.'})}"></div>
			</th:block>
		</div>
	</main>
	<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
	<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
