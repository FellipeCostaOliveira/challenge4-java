spring.application.name=pet_saude

# Porta: em nuvem (Render/Railway) a plataforma informa a porta pela variavel PORT.
server.port=${PORT:8080}
# Respeita os cabecalhos X-Forwarded-* do proxy da plataforma (HTTPS e host corretos nos redirects).
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:petsaudedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-migration-naming=true

# A validacao de Bean Validation acontece na camada web/servico. Desligada no JPA para
# que consultas de datas passadas possam ser marcadas como realizadas/canceladas.
spring.jpa.properties.jakarta.persistence.validation.mode=none
